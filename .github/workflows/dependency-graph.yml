# Submits the sbt build's dependencies to GitHub's dependency graph (#58), so
# Dependabot alerts cover the libraries every published artifact brings in.
# Runs on main only: a pull request from a fork has no write token to submit with.
name: Dependency graph

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # the dependency submission API needs it

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: sbt/setup-sbt@v1
      - uses: scalacenter/sbt-dependency-submission@v3
        with:
          # the published set; test-only and example projects are not shipped to users
          configs-ignore: test scala-tool scala-doc-tool test-internal
