# Scala Steward (#56): opens dependency update PRs, configured by .scala-steward.conf.
#
# One-time setup: add a SCALA_STEWARD_TOKEN repository secret (a fine-grained
# token with contents and pull-requests write on this repository). Without it
# the job falls back to GITHUB_TOKEN, whose PRs do not trigger the CI workflow.
name: Scala Steward

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays, 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  scala-steward:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: sbt/setup-sbt@v1
      - uses: scala-steward-org/scala-steward-action@v2
        with:
          github-token: ${{ secrets.SCALA_STEWARD_TOKEN || github.token }}
