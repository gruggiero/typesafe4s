# Scala Steward (#56). Updates arrive as PRs; the full CI matrix runs on each.

# Group updates so one ecosystem's release is one PR, not one per artifact.
pullRequests.grouping = [
  { name = "zio", "title" = "Update ZIO", "filter" = [{"group" = "dev.zio"}] },
  { name = "cats-effect", "title" = "Update Cats Effect and fs2", "filter" = [{"group" = "org.typelevel"}, {"group" = "co.fs2"}] },
  { name = "ox", "title" = "Update Ox", "filter" = [{"group" = "com.softwaremill.ox"}] },
  { name = "pekko", "title" = "Update Pekko", "filter" = [{"group" = "org.apache.pekko"}] },
  { name = "json", "title" = "Update JSON adapter libraries", "filter" = [{"group" = "io.circe"}, {"group" = "com.github.plokhotnyuk.jsoniter-scala"}, {"group" = "com.lihaoyi"}] },
  { name = "test", "title" = "Update test libraries", "filter" = [{"group" = "org.scalameta", "artifact" = "munit"}, {"group" = "org.scalameta", "artifact" = "munit-scalacheck"}] },
  { name = "sbt-plugins", "title" = "Update sbt plugins", "filter" = [{"group" = "com.eed3si9n"}, {"group" = "org.scalameta", "artifact" = "sbt-scalafmt"}, {"group" = "com.github.sbt"}, {"group" = "io.stryker-mutator"}] }
]

updates.pin = [
  # Scala 3.8.x is the published floor (TASTy is forward-compatible, so the
  # 3.8 build serves 3.9 callers). Moving the floor drops users, so it is a
  # maintainer decision; patch releases are fine.
  { groupId = "org.scala-lang", artifactId = "scala3-compiler", version = "3.8." },
  { groupId = "org.scala-lang", artifactId = "scala3-library", version = "3.8." }
]

updates.ignore = [
  # kyo-compat and its sbt plugin move together with the vendored
  # typesafe4s-compat-ce binding (removed upstream at 1.0.0-RC6). An update
  # needs the binding re-checked against the conformance suite by hand.
  { groupId = "io.getkyo" }
]

# The pin also holds the 3.9 verification axis (`scala39`) back from
# Steward's proposals; it is bumped by hand with the matrix.

commits.message = "Update ${artifactName} from ${currentVersion} to ${nextVersion}"
