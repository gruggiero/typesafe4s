# Ring 3 — mutation testing (verified-scala3 schema).
#
# THE `mutate` AND `test-filter` LISTS BELOW ARE FIXED AND MUST BE RETARGETED
# PER SPEC. Running this unchanged scores whatever the previous spec targeted
# and tells you nothing about the one you are implementing. Set both to the
# spec's changed files before running:
#
#   git diff --name-only <baseline-SHA>
#
# MATRIX NOTE, specific to this project. `typesafe4s-client` is an
# sbt-projectmatrix build: one source tree compiled into six cells. A mutation
# run must therefore name WHICH CELL runs the tests, because "the tests" is six
# different test runs:
#
#   sbt clientZio/stryker        # or clientCe / clientOx / clientKyo / clientPekko
#
# `typesafe4s-core` has a single cell, so `sbt core/stryker` is unambiguous and
# is the preferred target: core is pure and sans-IO, which is where mutation
# testing earns the most and costs the least.
#
# Mutating SHARED client sources scores them through exactly one backend. That
# is fine — the shared sources are identical per row — but record which row ran,
# because a surviving mutant found on one row is a gap on all five.

stryker4s {
  base-dir = "typesafe4s-core"

  # RETARGET per spec. Paths are relative to base-dir.
  # Currently: spec 4/8 — retry-policy.
  # The spec's pure surface lives in core by design (contract D3): schedule
  # arithmetic, classification, construction invariants. The retry loop
  # (client/shared/.../internal/Retry.scala) is thin carrier glue — recover,
  # consult nextWait, sleep, recurse — outside core/stryker's base-dir and
  # covered by the driven oracle on every row instead.
  mutate = [
    "src/main/scala/typesafe4s/Attempt.scala",
    "src/main/scala/typesafe4s/RetryPolicy.scala"
  ]

  # RETARGET per spec. Fully-qualified suite names.
  #
  # RetryPolicyProperties is the spec's core oracle: the schedule properties
  # (P3 + kernel bridge), the exhaustive classification/advised-delay
  # batteries, the defaults, the pure boundary tests, the Ring-8 regression
  # tests and the construction-invariant refusals — every mutatable
  # expression in the two mutate files is exercised by it. The loop-level
  # properties (P1, P2) live in the client module and cannot run under
  # core/stryker; they cover Retry.scala, which is not in the mutate list
  # anyway.
  #
  # `outside.RetryPolicyCompileNegativeSuite` CANNOT be in this filter —
  # measured limitation: under stryker's instrumented build, `apply`'s
  # inline-checked signature becomes non-constant, so `inline if` cannot
  # reduce at ANY `RetryPolicy(...)` call — including this suite's
  # compileErrors snippets, which typecheck against the mutated signature.
  # Every test in it fails the initial run. Mutants inside `apply`'s
  # literal-gate region are therefore undetectable by any suite and will
  # report as justified survivors; they are verified by Ring 0 compilation
  # plus this suite in normal (uninstrumented) runs.
  test-filter = [
    "typesafe4s.RetryPolicyProperties"
  ]

  thresholds {
    high = 90
    low = 80
    break = 75
  }

  reporters = ["console", "html"]
  open-report = false
  scala-dialect = "scala3"

  # Cold-JVM suite start exceeds the 5s default net budget on this box.
  timeout = 60s
  timeout-factor = 2.0

  # Parallel forked test-runners race JVM startup here; a single runner is
  # slower but reliable on this box.
  concurrency = 1
}
